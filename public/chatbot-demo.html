<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>finthara.com — chatbot demo clip</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --ink:#0B2540;
    --grid:#1C3E60;
    --paper:#EAEFF3;
    --paper-dim:#D8E0E7;
    --ai:#2FC2B2;
    --ai-dark:#0C3B36;
    --user:#E7A23D;
    --user-dark:#4A340F;
    --text-dark:#132233;
    --text-mid:#5B6B7A;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    width:100%;
    min-height:100vh;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/40px 40px,
      var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 16px;
    font-family:'Inter',sans-serif;
  }

  .stage{
    position:relative;
    width:390px;
  }

  .crop{
    position:absolute;
    width:22px;
    height:22px;
    border-color:rgba(234,239,243,0.35);
    border-style:solid;
  }
  .crop.tl{top:-14px;left:-14px;border-width:2px 0 0 2px;}
  .crop.tr{top:-14px;right:-14px;border-width:2px 2px 0 0;}
  .crop.bl{bottom:-14px;left:-14px;border-width:0 0 2px 2px;}
  .crop.br{bottom:-14px;right:-14px;border-width:0 2px 2px 0;}

  .label{
    position:absolute;
    top:-40px;
    left:0;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    color:rgba(234,239,243,0.55);
    text-transform:uppercase;
  }
  .label span{color:var(--ai);}

  .phone{
    width:390px;
    height:780px;
    background:var(--paper);
    border-radius:38px;
    border:8px solid #0E2C4A;
    box-shadow:0 30px 60px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.04);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }

  .notch{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:120px; height:26px;
    background:#0E2C4A;
    border-radius:0 0 16px 16px;
    z-index:5;
  }

  .topbar{
    padding:38px 20px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--paper-dim);
    background:var(--paper);
  }
  .logo{
    width:30px;height:30px;border-radius:8px;
    background:var(--ai-dark);
    display:flex;align-items:center;justify-content:center;
  }
  .logo svg{width:16px;height:16px;}
  .topbar-text .name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--text-dark);
  }
  .topbar-text .status{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--ai-dark);
    display:flex;
    align-items:center;
    gap:5px;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ai);}

  .thread{
    flex:1;
    padding:20px 16px 24px;
    display:flex;
    flex-direction:column;
    gap:12px;
    overflow:hidden;
    transition:opacity .35s ease;
  }
  .thread.resetting{opacity:0;}

  .row{display:flex;opacity:0;transform:translateY(8px);}
  .row.ai{justify-content:flex-start;}
  .row.user{justify-content:flex-end;}

  .bubble{
    max-width:74%;
    padding:11px 14px;
    font-size:14px;
    line-height:1.45;
    font-weight:400;
  }
  .row.ai .bubble{
    background:#fff;
    color:var(--text-dark);
    border:1px solid var(--paper-dim);
    border-radius:4px 14px 14px 14px;
  }
  .row.user .bubble{
    background:var(--user);
    color:var(--user-dark);
    font-weight:500;
    border-radius:14px 4px 14px 14px;
  }

  .typing{
    display:flex;
    gap:4px;
    padding:13px 14px;
    background:#fff;
    border:1px solid var(--paper-dim);
    border-radius:4px 14px 14px 14px;
    width:fit-content;
  }
  .typing i{
    width:6px;height:6px;border-radius:50%;
    background:var(--text-mid);
    opacity:0.35;
    animation:bounce 1s infinite;
  }
  .typing i:nth-child(2){animation-delay:0.15s;}
  .typing i:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.35;}30%{transform:translateY(-4px);opacity:0.9;}}

  .genrow{
    opacity:0;
    transform:translateY(8px);
    background:#fff;
    border:1px solid var(--paper-dim);
    border-radius:12px;
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .genrow .gtitle{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--ai-dark);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .spin{
    width:11px;height:11px;
    border-radius:50%;
    border:2px solid var(--paper-dim);
    border-top-color:var(--ai);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .track{
    height:5px;
    border-radius:3px;
    background:var(--paper-dim);
    overflow:hidden;
  }
  .fill{
    height:100%;
    width:0%;
    background:var(--ai);
    border-radius:3px;
  }

  .homebar{
    width:120px;height:4px;border-radius:3px;
    background:#0E2C4A;
    margin:10px auto 12px;
    opacity:0.5;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="label">Onboarding flow <span>&mdash; live demo</span></div>
  <span class="crop tl"></span><span class="crop tr"></span><span class="crop bl"></span><span class="crop br"></span>

  <div class="phone">
    <div class="notch"></div>
    <div class="topbar">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2FC2B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h5"/></svg>
      </div>
      <div class="topbar-text">
        <div class="name">finthara.com</div>
        <div class="status"><span class="dot"></span>drafting your blueprint</div>
      </div>
    </div>

    <div class="thread" id="thread"></div>
    <div class="homebar"></div>
  </div>
</div>

<script>
const thread = document.getElementById('thread');

function el(html){
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstChild;
}

function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

function scrollDown(){ thread.scrollTop = thread.scrollHeight; }

async function showTyping(){
  const row = el(`<div class="row ai" style="opacity:1;transform:none;transition:all .3s"><div class="typing"><i></i><i></i><i></i></div></div>`);
  thread.appendChild(row);
  scrollDown();
  await wait(950);
  row.remove();
}

async function aiMessage(text){
  await showTyping();
  const row = el(`<div class="row ai"><div class="bubble">${text}</div></div>`);
  thread.appendChild(row);
  scrollDown();
  requestAnimationFrame(() => {
    row.style.transition = 'all .35s ease';
    row.style.opacity = '1';
    row.style.transform = 'none';
  });
  await wait(550);
}

async function userMessage(text){
  await wait(500);
  const row = el(`<div class="row user"><div class="bubble">${text}</div></div>`);
  thread.appendChild(row);
  scrollDown();
  requestAnimationFrame(() => {
    row.style.transition = 'all .3s ease';
    row.style.opacity = '1';
    row.style.transform = 'none';
  });
  await wait(650);
}

async function generating(){
  const row = el(`
    <div class="genrow">
      <div class="gtitle"><span class="spin"></span>generating report&hellip;</div>
      <div class="track"><div class="fill" id="fillbar"></div></div>
    </div>
  `);
  thread.appendChild(row);
  scrollDown();
  requestAnimationFrame(() => {
    row.style.transition = 'all .35s ease';
    row.style.opacity = '1';
    row.style.transform = 'none';
  });
  await wait(200);
  const fill = document.getElementById('fillbar');
  fill.style.transition = 'width 2.4s ease';
  fill.style.width = '100%';
  await wait(2600);
}

// A visitor can land on this page at ANY point in the loop — including the instant it
// resets. Swapping `thread.innerHTML = ''` for an instant blank screen meant anyone whose
// scroll/screenshot happened to catch that split second saw an apparently-broken, empty
// phone. This fades the old thread out first (so there's always SOMETHING on screen, never
// a hard cut to blank) and skips that fade — and starts the very first messages sooner —
// on the very first run, since first paint is the moment most likely to be seen.
async function resetThread(isFirstRun){
  if (!isFirstRun){
    thread.classList.add('resetting');
    await wait(350);
  }
  thread.innerHTML = '';
  thread.classList.remove('resetting');
}

async function playOnce(isFirstRun){
  await resetThread(isFirstRun);
  await wait(isFirstRun ? 150 : 400);
  await aiMessage('Hi Abhay');
  await aiMessage("What's your business idea?");
  await userMessage('A subscription app connecting home bakers with local buyers');
  await aiMessage('Got it. Do you want a long report or a short one?');
  await userMessage('Short');
  await generating();
  await wait(2200);
}

async function loop(){
  let first = true;
  while(true){
    await playOnce(first);
    first = false;
  }
}

loop();
</script>

</body>
</html>
